rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not provide any actions.
  appropriate-polling:
    status: done
    comment: Polls every 30 seconds, or every 5 seconds while a print is active.
  brands:
    status: todo
  common-modules:
    status: done
  config-flow-test-coverage:
    status: done
  config-flow:
    status: done
  dependency-transparency:
    status: todo
    comment: >-
      websockets is declared with a compatible version range instead of an
      exact pin to avoid conflicts with Home Assistant's dependency set.
  docs-actions:
    status: exempt
    comment: The integration does not provide any actions.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: todo
  entity-event-setup:
    status: exempt
    comment: The integration does not subscribe to events.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
  test-before-configure:
    status: done
  test-before-setup:
    status: exempt
    comment: >-
      The printer is expected to be offline most of the time. The entry loads
      immediately with unavailable entities and the coordinator retries on its
      normal polling interval.
  unique-config-entry:
    status: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration does not provide any actions.
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: todo
  docs-installation-parameters:
    status: todo
  entity-unavailable:
    status: done
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
  parallel-updates:
    status: done
  reauthentication-flow:
    status: exempt
    comment: The printer does not use authentication.
  test-coverage:
    status: todo

  # Gold
  devices:
    status: done
  diagnostics:
    status: todo
  discovery-update-info:
    status: exempt
    comment: The integration does not support discovery.
  discovery:
    status: todo
  docs-data-update:
    status: todo
  docs-examples:
    status: todo
  docs-known-limitations:
    status: todo
  docs-supported-devices:
    status: todo
  docs-supported-functions:
    status: todo
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: todo
  dynamic-devices:
    status: exempt
    comment: The integration has one static device per config entry.
  entity-category:
    status: todo
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: done
    comment: All sensors are useful by default, so none are disabled.
  entity-translations:
    status: done
  exception-translations:
    status: todo
  icon-translations:
    status: todo
  reconfiguration-flow:
    status: todo
  repair-issues:
    status: exempt
    comment: >-
      The printer is expected to be offline regularly. Availability is handled
      by entity state and coordinator logging, so an offline printer does not
      create a repair issue.
  stale-devices:
    status: exempt
    comment: The integration has one static device per config entry.

  # Platinum
  async-dependency:
    status: done
  inject-websession:
    status: exempt
    comment: The integration uses a websocket connection, not an aiohttp session.
  strict-typing:
    status: todo
